apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

generators:
  - secret-generator.yaml

helmCharts:
  - name: traefik
    includeCRDs: true
    repo: https://github.com/NEwa-05/argo-dependencies-test/tree/main/charts/hub-apim-dependency
    releaseName: hub-apim-dependency
    namespace: traefik
    valuesFile: hub-values.yaml

